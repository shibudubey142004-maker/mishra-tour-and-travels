<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mishra Tour and Travels — Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#172033;font-family:Inter,system-ui,-apple-system,sans-serif}header{background:#101828;color:#fff;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px}header a,header button{color:#fff;background:#1d2939;text-decoration:none;border:0;border-radius:8px;padding:9px 12px;cursor:pointer}.wrap{max-width:1350px;margin:auto;padding:24px 18px}.login{max-width:430px;margin:70px auto;background:#fff;padding:28px;border:1px solid #e5e7eb;border-radius:18px;box-shadow:0 8px 30px #10182812}.login h1{margin-top:0}.field{display:grid;gap:7px;margin:12px 0}.field input,.field select{padding:11px;border:1px solid #d0d5dd;border-radius:9px;font:inherit;width:100%}.field textarea{padding:11px;border:1px solid #d0d5dd;border-radius:9px;font:inherit;resize:vertical}.primary{background:#101828;color:#fff;border:0}.secondary{background:#eef2f6;color:#172033;border:0}.danger{background:#fee4e2;color:#b42318;border:0}.ok{background:#dcfae6;color:#027a48;border:0}.warn{background:#fff6ed;color:#b54708;border:0}.btn{padding:9px 11px;border-radius:8px;cursor:pointer}.muted{color:#667085}.error{background:#fef3f2;color:#b42318;padding:10px;border-radius:9px;margin:12px 0}.success{background:#ecfdf3;color:#027a48;padding:10px;border-radius:9px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.stat,.panel{background:#fff;border:1px solid #e4e7ec;border-radius:15px;padding:18px}.stat b{display:block;font-size:28px;margin-top:5px}.tabs{display:flex;gap:8px;margin:20px 0;flex-wrap:wrap}.tabs button{padding:10px 14px;border:0;border-radius:9px;background:#e4e7ec;cursor:pointer}.tabs button.active{background:#101828;color:#fff}.panel{margin-top:16px;overflow:auto}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}table{width:100%;border-collapse:collapse;min-width:900px}th,td{text-align:left;padding:11px;border-bottom:1px solid #edf0f4;font-size:14px;vertical-align:top}.badge{display:inline-block;padding:4px 8px;border-radius:999px;font-size:12px;font-weight:600}.badge.confirmed,.badge.paid{background:#dcfae6;color:#027a48}.badge.pending{background:#fff6ed;color:#b54708}.badge.cancelled{background:#fee4e2;color:#b42318}.badge.inactive{background:#f2f4f7;color:#475467}.actions{display:flex;gap:6px;flex-wrap:wrap}.empty{text-align:center;padding:30px;color:#667085}.modal-backdrop{position:fixed;inset:0;background:#10182899;display:flex;align-items:center;justify-content:center;padding:18px;z-index:20}.modal{background:#fff;border-radius:16px;max-width:620px;width:100%;max-height:92vh;overflow:auto;padding:22px;box-shadow:0 20px 60px #10182833}.modal-head{display:flex;justify-content:space-between;align-items:center;gap:12px}.modal-head button{border:0;background:#eef2f6;border-radius:8px;padding:7px 10px;cursor:pointer}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.hint{font-size:12px;color:#667085}.hidden{display:none}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}.form-grid{grid-template-columns:1fr}.full{grid-column:auto}}@media(max-width:520px){.grid{grid-template-columns:1fr}.wrap{padding:18px 12px}}
</style>
</head>
<body>
<header><b>MISHRA TOUR AND TRAVELS — ADMIN</b><div id="headActions"><a href="../index.html">Customer site</a></div></header>
<main id="app"></main>
<div id="modalRoot"></div>
<script>
const SUPABASE_URL="https://ocslpuiiiebtdawitiyq.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_xwgOA5e_h6Opmmc9ZRpBzg_EqnviaxO";
const db=supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
let state={tab:'bookings',bookings:[],rides:[],customers:[],availability:[],query:'',message:'',error:''};
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const money=v=>'₹'+Number(v||0).toLocaleString('en-IN',{maximumFractionDigits:2});
function loginView(msg=''){app.innerHTML=`<section class="login"><h1>Admin Login</h1><p class="muted">Mishra Tour and Travels management</p>${msg?`<div class="error">${esc(msg)}</div>`:''}<form onsubmit="login(event)"><div class="field"><label>Email</label><input id="email" type="email" required></div><div class="field"><label>Password</label><input id="password" type="password" required></div><button class="btn primary" style="width:100%;padding:12px">Sign in</button></form></section>`}
async function login(e){e.preventDefault();const {error}=await db.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error)return loginView(error.message);await boot()}
async function logout(){await db.auth.signOut();state.message='';state.error='';loginView()}
async function boot(){try{const {data:{session}}=await db.auth.getSession();if(!session){loginView();return} $('headActions').innerHTML=`<a href="../index.html">Customer site</a><button onclick="logout()">Sign out</button>`;await load();render()}catch(e){loginView(e.message||'Unable to load admin dashboard.')}}
async function load(){const [b,r,c,a]=await Promise.all([
 db.from('bookings').select('id,booking_code,ride_id,customer_id,travel_date,passengers,pickup,amount,status,payment_status,vehicle_type,created_at,rides(title,destination),customers(name,phone,email)').order('created_at',{ascending:false}),
 db.from('rides').select('*').order('created_at',{ascending:false}),
 db.from('customers').select('*').order('created_at',{ascending:false}),
 db.from('ride_availability').select('*,rides(title,total_seats)').order('travel_date',{ascending:true})
]);
 for(const x of [b,r,c,a])if(x.error){if(x.error.code==='42501'||/permission|row-level|policy/i.test(x.error.message))throw new Error('Admin access is not configured. Run the admin SQL and make sure your email is in admin_users.');throw x.error}
 state.bookings=b.data||[];state.rides=r.data||[];state.customers=c.data||[];state.availability=a.data||[];
}
function render(){const b=state.bookings;app.innerHTML=`<div class="wrap"><h1>Dashboard</h1>${state.message?`<div class="success">${esc(state.message)}</div>`:''}${state.error?`<div class="error">${esc(state.error)}</div>`:''}<div class="grid"><div class="stat">Total bookings<b>${b.length}</b></div><div class="stat">Passengers<b>${b.reduce((n,x)=>n+Number(x.passengers||0),0)}</b></div><div class="stat">Confirmed<b>${b.filter(x=>x.status==='confirmed').length}</b></div><div class="stat">Pending payment<b>${b.filter(x=>x.payment_status==='pending').length}</b></div></div><div class="tabs"><button class="${state.tab==='bookings'?'active':''}" onclick="tab('bookings')">Bookings</button><button class="${state.tab==='rides'?'active':''}" onclick="tab('rides')">Tours</button><button class="${state.tab==='availability'?'active':''}" onclick="tab('availability')">Availability</button><button class="${state.tab==='customers'?'active':''}" onclick="tab('customers')">Customers</button></div><div id="content"></div></div>`;if(state.tab==='bookings')bookingsView();if(state.tab==='rides')ridesView();if(state.tab==='availability')availabilityView();if(state.tab==='customers')customersView()}
function tab(t){state.tab=t;state.message='';state.error='';render()}
function bookingsView(){let q=state.query.toLowerCase();let rows=state.bookings.filter(b=>[b.booking_code,b.customers?.name,b.customers?.phone,b.rides?.title,b.travel_date].join(' ').toLowerCase().includes(q));content.innerHTML=`<div class="panel"><div class="toolbar"><h2>Bookings</h2><input class="search" style="padding:10px 12px;border:1px solid #d0d5dd;border-radius:9px;min-width:260px" placeholder="Search booking, customer, phone..." value="${esc(state.query)}" oninput="state.query=this.value;bookingsView()"></div><table><thead><tr><th>Booking</th><th>Customer</th><th>Tour</th><th>Travel</th><th>Passengers</th><th>Vehicle</th><th>Amount</th><th>Status</th><th>Payment</th><th>Actions</th></tr></thead><tbody>${rows.map(b=>`<tr><td><b>${esc(b.booking_code)}</b><br><small>${new Date(b.created_at).toLocaleString()}</small></td><td>${esc(b.customers?.name)}<br>${esc(b.customers?.phone)}<br>${esc(b.customers?.email||'')}</td><td>${esc(b.rides?.title)}<br><small>${esc(b.rides?.destination)}</small></td><td>${esc(b.travel_date)}<br><small>${esc(b.pickup)}</small></td><td>${b.passengers}</td><td>${esc(b.vehicle_type||b.rides?.vehicle||'Not specified')}</td><td>${money(b.amount)}</td><td><span class="badge ${b.status}">${b.status}</span></td><td><span class="badge ${b.payment_status}">${b.payment_status}</span></td><td><div class="actions">${b.status!=='confirmed'?`<button class="btn ok" onclick="statusUpdate('${b.id}','confirmed')">Confirm</button>`:''}${b.status!=='cancelled'?`<button class="btn danger" onclick="statusUpdate('${b.id}','cancelled')">Cancel</button>`:''}${b.payment_status!=='paid'?`<button class="btn secondary" onclick="paymentUpdate('${b.id}','paid')">Mark paid</button>`:''}</div></td></tr>`).join('')||`<tr><td colspan="10" class="empty">No bookings found.</td></tr>`}</tbody></table></div>`}
async function statusUpdate(id,status){if(status==='cancelled'&&!confirm('Cancel this booking and restore its seats?'))return;try{const {error}=await db.rpc('admin_update_booking_status',{p_booking_id:id,p_status:status});if(error)throw error;await load();state.message='Booking status updated.';render()}catch(e){alert(e.message)}}
async function paymentUpdate(id,status){try{const {error}=await db.rpc('admin_update_payment_status',{p_booking_id:id,p_payment_status:status});if(error)throw error;await load();state.message='Payment status updated.';render()}catch(e){alert(e.message)}}
function ridesView(){content.innerHTML=`<div class="panel"><div class="toolbar"><div><h2 style="margin:0">Tours</h2><span class="hint">Create, edit, activate or deactivate tours.</span></div><button class="btn primary" onclick="openRideModal()">+ Add tour</button></div><table><thead><tr><th>Tour</th><th>Destination</th><th>Vehicle</th><th>Duration</th><th>Price</th><th>Seats</th><th>Active</th><th>Actions</th></tr></thead><tbody>${state.rides.map(r=>`<tr><td><b>${esc(r.title)}</b></td><td>${esc(r.destination)}</td><td>${esc(r.vehicle)}</td><td>${r.duration_days} day(s)</td><td>${money(r.price)}</td><td>${r.total_seats}</td><td><span class="badge ${r.active?'confirmed':'inactive'}">${r.active?'active':'inactive'}</span></td><td><div class="actions"><button class="btn secondary" onclick="openRideModal('${r.id}')">Edit</button><button class="btn ${r.active?'danger':'ok'}" onclick="toggleRide('${r.id}',${!r.active})">${r.active?'Deactivate':'Activate'}</button></div></td></tr>`).join('')||`<tr><td colspan="8" class="empty">No tours yet.</td></tr>`}</tbody></table></div>`}
function openRideModal(id=''){const r=state.rides.find(x=>x.id===id)||{title:'',destination:'',vehicle:'',duration_days:1,price:'',total_seats:1,active:true};modalRoot.innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-head"><h2>${id?'Edit tour':'Add tour'}</h2><button onclick="closeModal()">✕</button></div><form onsubmit="saveRide(event,'${id}')"><div class="form-grid"><div class="field full"><label>Tour title</label><input id="ride_title" required value="${esc(r.title)}"></div><div class="field"><label>Destination</label><input id="ride_destination" required value="${esc(r.destination)}"></div><div class="field"><label>Vehicle</label><input id="ride_vehicle" required value="${esc(r.vehicle)}"></div><div class="field"><label>Duration (days)</label><input id="ride_duration" type="number" min="1" required value="${r.duration_days}"></div><div class="field"><label>Price (₹)</label><input id="ride_price" type="number" min="0" step="0.01" required value="${r.price}"></div><div class="field"><label>Total seats</label><input id="ride_seats" type="number" min="1" required value="${r.total_seats}"></div><div class="field"><label>Status</label><select id="ride_active"><option value="true" ${r.active?'selected':''}>Active</option><option value="false" ${!r.active?'selected':''}>Inactive</option></select></div></div><div class="modal-actions"><button type="button" class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn primary">Save tour</button></div></form></div></div>`}
async function saveRide(e,id){e.preventDefault();const payload={title:$('ride_title').value.trim(),destination:$('ride_destination').value.trim(),vehicle:$('ride_vehicle').value.trim(),duration_days:Number($('ride_duration').value),price:Number($('ride_price').value),total_seats:Number($('ride_seats').value),active:$('ride_active').value==='true'};try{const q=id?db.from('rides').update(payload).eq('id',id):db.from('rides').insert(payload);const {error}=await q;if(error)throw error;closeModal();await load();state.tab='rides';state.message=id?'Tour updated successfully.':'Tour created successfully.';render()}catch(e){alert(e.message)}}
async function toggleRide(id,active){const r=state.rides.find(x=>x.id===id);if(!r)return;if(!active&&!confirm(`Deactivate "${r.title}"? New customers will no longer see it.`))return;try{const {error}=await db.from('rides').update({active}).eq('id',id);if(error)throw error;await load();state.message=active?'Tour activated.':'Tour deactivated.';render()}catch(e){alert(e.message)}}
function availabilityView(){content.innerHTML=`<div class="panel"><div class="toolbar"><div><h2 style="margin:0">Availability</h2><span class="hint">Create a travel date, set available seats, or block a date.</span></div><button class="btn primary" onclick="openAvailabilityModal()">+ Add date</button></div><table><thead><tr><th>Tour</th><th>Date</th><th>Available seats</th><th>Blocked</th><th>Actions</th></tr></thead><tbody>${state.availability.map(a=>`<tr><td>${esc(a.rides?.title||a.ride_id)}</td><td>${esc(a.travel_date)}</td><td>${a.available_seats} / ${a.rides?.total_seats??'—'}</td><td><span class="badge ${a.blocked?'cancelled':'confirmed'}">${a.blocked?'blocked':'open'}</span></td><td><button class="btn secondary" onclick="openAvailabilityModal('${a.id}')">Edit</button></td></tr>`).join('')||`<tr><td colspan="5" class="empty">No availability rows yet. They are created automatically when a booking is made, or you can add one manually.</td></tr>`}</tbody></table></div>`}
function openAvailabilityModal(id=''){const a=state.availability.find(x=>x.id===id)||null;const today=new Date().toISOString().slice(0,10);modalRoot.innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-head"><h2>${id?'Edit availability':'Add availability date'}</h2><button onclick="closeModal()">✕</button></div><form onsubmit="saveAvailability(event,'${id}')"><div class="field"><label>Tour</label><select id="av_ride" required ${id?'disabled':''}>${state.rides.filter(r=>r.active||a?.ride_id===r.id).map(r=>`<option value="${r.id}" ${a?.ride_id===r.id?'selected':''}>${esc(r.title)} — ${esc(r.destination)}</option>`).join('')}</select></div><div class="field"><label>Travel date</label><input id="av_date" type="date" min="${today}" required value="${esc(a?.travel_date||'') }" ${id?'disabled':''}></div><div class="field"><label>Available seats</label><input id="av_seats" type="number" min="0" required value="${a?.available_seats ?? ''}"><span class="hint">Do not set this above the tour's total seats.</span></div><div class="field"><label>Blocked</label><select id="av_blocked"><option value="false" ${!a?.blocked?'selected':''}>Open</option><option value="true" ${a?.blocked?'selected':''}>Blocked</option></select></div><div class="modal-actions"><button type="button" class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn primary">Save availability</button></div></form></div></div>`}
async function saveAvailability(e,id){e.preventDefault();const rideId=$('av_ride').value;const seats=Number($('av_seats').value);const ride=state.rides.find(r=>r.id===rideId);if(ride&&seats>ride.total_seats)return alert(`Available seats cannot exceed ${ride.total_seats}.`);const payload={ride_id:rideId,travel_date:$('av_date').value,available_seats:seats,blocked:$('av_blocked').value==='true'};try{let result;if(id){result=await db.from('ride_availability').update({available_seats:seats,blocked:payload.blocked}).eq('id',id)}else{result=await db.from('ride_availability').insert(payload)}if(result.error)throw result.error;closeModal();await load();state.tab='availability';state.message=id?'Availability updated successfully.':'Availability date created successfully.';render()}catch(e){alert(e.message)}}
function customersView(){content.innerHTML=`<div class="panel"><div class="toolbar"><h2>Customers</h2></div><table><thead><tr><th>Name</th><th>Phone</th><th>Email</th><th>Joined</th></tr></thead><tbody>${state.customers.map(c=>`<tr><td>${esc(c.name)}</td><td>${esc(c.phone)}</td><td>${esc(c.email||'')}</td><td>${new Date(c.created_at).toLocaleString()}</td></tr>`).join('')||`<tr><td colspan="4" class="empty">No customers yet.</td></tr>`}</tbody></table></div>`}
function closeModal(){modalRoot.innerHTML=''}
db.auth.onAuthStateChange(()=>setTimeout(boot,0));boot();
</script>
</body>
</html>
